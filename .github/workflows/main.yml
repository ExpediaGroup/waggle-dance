name: Java CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to use to run from."
        required: true
        default: "main"
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Package and run all tests
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: Init Coveralls
      shell: bash
      run: |
          COVERALLS_TOKEN=${{ secrets.COVERALLS_REPO_TOKEN }}
          if [[ -z "${COVERALLS_TOKEN}" ]];
          then
             echo "Coveralls token not available"
             COVERALLS_SKIP=true
          else
             echo "Coveralls token available"
             COVERALLS_SKIP=false
          fi
          echo "COVERALLS_SKIP=${COVERALLS_SKIP}" >> $GITHUB_ENV
    - name: Set up JDK
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: '8'
        java-package: jdk

    - name: Install Local Dependencies
      run: |
          lib/install_local_libs.sh

    - name: Run Maven Targets
      run: mvn verify jacoco:report coveralls:report --batch-mode --show-version --activate-profiles coveralls -Dcoveralls.skip=$COVERALLS_SKIP -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }}
